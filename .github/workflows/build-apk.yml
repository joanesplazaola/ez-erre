name: Build & Release Android APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Versión de la release (ej. v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"
      - run: gradle --no-daemon assembleDebug
      - run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/ez-erre.apk
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" release/ez-erre.apk --target "${GITHUB_SHA}" --title "EZ ERRE $VERSION" --generate-notes
